<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel AI — Autonomous Security & QA Platform</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l8 3.5v6c0 5-3.5 9-8 10.5C7.5 20.5 4 16.5 4 11.5v-6L12 2z' fill='none' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M8.8 12l2.2 2.2 4.2-4.4' fill='none' stroke='%2334d399' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>

<div class="app">
  <!-- ============================ SIDEBAR ============================ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3.5v6c0 5-3.5 9-8 10.5C7.5 20.5 4 16.5 4 11.5v-6L12 2z"/>
          <path d="M8.8 12l2.2 2.2 4.2-4.4"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">SENTINEL<span class="accent">AI</span></div>
        <div class="brand-sub">autonomous security & QA</div>
      </div>
    </div>
    <nav>
      <a href="#/dashboard" data-nav="dashboard" class="nav-item">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span> Dashboard</a>
      <a href="#/scan" data-nav="scan" class="nav-item">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span> New Scan</a>
      <a href="#/scans" data-nav="scans" class="nav-item">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/>
          <circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></span> Scans & Results</a>
      <a href="#/reports" data-nav="reports" class="nav-item">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7l-5-5z"/>
          <path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></svg></span> Reports</a>
      <a href="#/monitor" data-nav="monitor" class="nav-item">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 5 14 2.5-7h4"/></svg></span> Monitoring
        <span id="alertBadge" class="badge hidden">0</span></a>
      <a href="#/learn" data-nav="learn" class="nav-item">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> Learning</a>
    </nav>
    <div class="sidebar-foot">
      <div id="aiBackend" class="pill"></div>
      <div class="foot-note">authorized testing only</div>
    </div>
  </aside>

    <!-- ============================ MAIN ============================== -->
    <main class="main">
      <header class="topbar">
        <div class="row" style="gap:10px;min-width:0">
          <button class="hamburger" onclick="toggleSidebar(true)" aria-label="Open menu">&#9776;</button>
          <h1 id="pageTitle" style="min-width:0">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <span id="healthDot" class="dot"></span><span id="healthTxt" class="txt">connecting…</span>
        </div>
      </header>
      <section id="view" class="view"><!-- SPA view rendered here --></section>
    </main>
  </div>
  <div class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

<!-- ============================ MODAL SHELL ============================ -->
<div id="modal" class="modal hidden">
  <div class="modal-backdrop" onclick="UI.closeModal()"></div>
  <div class="modal-card" id="modalCard"></div>
</div>

<div id="toasts" class="toasts"></div>

<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
